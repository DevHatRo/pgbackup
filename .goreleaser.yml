version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # Keep only the "Recommended 6" matrix:
      # linux/{amd64,arm64,arm}, darwin/{amd64,arm64}, windows/amd64.
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.BuildTime={{.Date}}
    binary: pgbackup

homebrew_casks:
  - name: pgbackup
    repository:
      owner: DevHatRo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/DevHatRo/pgbackup"
    description: "Single-binary PostgreSQL rotating-backup tool"
    # Don't auto-bump the cask on pre-releases/snapshots.
    skip_upload: auto
    binaries:
      - pgbackup
    # Strip the quarantine xattr so the unsigned binary runs without Gatekeeper prompts.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/pgbackup"]
          end

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - pg_backup.example.yaml

release:
  # release-please creates the GitHub release (and tag) with the changelog as
  # its body; GoReleaser only uploads the artifacts to it and leaves the
  # name/body untouched.
  mode: keep-existing

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from release-please (CHANGELOG.md).
changelog:
  disable: true
