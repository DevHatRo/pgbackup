version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # Keep only the "Recommended 6" matrix:
      # linux/{amd64,arm64,arm}, darwin/{amd64,arm64}, windows/amd64.
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.BuildTime={{.Date}}
    binary: pgbackup

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - pg_backup.example.yaml

release:
  header: |
    ## pgbackup {{ .Version }}

    Single-binary PostgreSQL rotating-backup tool. Drop the binary on the host,
    add a YAML config and a cron entry. See the README for setup and restore.

    ### Binaries
    - Linux: `pgbackup-linux-amd64`, `pgbackup-linux-arm64`, `pgbackup-linux-arm`
    - macOS: `pgbackup-darwin-amd64`, `pgbackup-darwin-arm64` (Apple Silicon)
    - Windows: `pgbackup-windows-amd64.exe`

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
